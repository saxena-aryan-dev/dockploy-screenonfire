# Nixpacks configuration for ScreenOnFire
# Optimized for Dokploy deployment

[phases.setup]
nixPkgs = ["nodejs_20", "openssl", "postgresql"]

[phases.install]
cmds = [
  "npm ci --legacy-peer-deps",
  "npx prisma generate"
]

# Copy static files and public folder for standalone mode
[phases.build]
cmds = [
  "npm run build",
  "cp -r public .next/standalone/",
  "cp -r .next/static .next/standalone/.next/"
]

[start]
cmd = "npm run start:prod"

[variables]
NODE_ENV = "production"
